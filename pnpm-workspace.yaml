packages:
  - "apps/*"
  - "packages/*"

# @veramo/credential-ld pulls in @veramo-community/lds-ecdsa-secp256k1-recovery2020,
# which Veramo only publishes as a git dependency (not on npm). pnpm v10+ blocks
# exotic (git/tarball) transitive deps by default; allow them so this resolves.
blockExoticSubdeps: false

peerDependencyRules:
  ignoreMissing:
    - "react"
    - "react-dom"
    - "react-jazzicon"
    - "@mantine/core"
    - "@mantine/hooks"
    - "@blocknote/core"
    - "@blocknote/react"
    - "@blocknote/mantine"
    - "@ixo/surveys"

overrides:
  ws: "8.18.2"
  "@langchain/core": "1.1.48"
  "@langchain/langgraph": "1.3.2"
  "@langchain/langgraph-checkpoint": "1.0.2"
  "@langchain/langgraph-checkpoint-sqlite": "1.0.1"
  "@langchain/langgraph-checkpoint-validation": "1.0.9"
  "@langchain/langgraph-supervisor": "1.0.3"
  "@langchain/community": "1.1.28"
  "@langchain/openai": "1.4.7"
  "@langchain/textsplitters": "1.0.1"
  "@langchain/mcp-adapters": "1.1.3"
  langchain: "1.4.2"
  "@composio/core": "0.10.0"
  "@composio/langchain": "0.9.2"
  "@digitalbazaar/http-client": "4.2.0"
  "@ixo/matrix": "1.2.33"

minimumReleaseAgeExclude:
  - '@ixo/*'

# Packages allowed to run install/build scripts. Replaces onlyBuiltDependencies,
# which pnpm v11 removed. These are native/postinstall-heavy deps we trust.
allowBuilds:
  "@ixo/matrix-sdk-crypto-nodejs": true
  "@matrix-org/matrix-sdk-crypto-nodejs": true
  "@nestjs/core": true
  "@scarf/scarf": true
  "@swc/core": true
  "@veramo/credential-ld": true
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  maplibre-gl: true
  msgpackr-extract: true
  protobufjs: true
  secp256k1: true
  sharp: true
  ssh2: true
  unrs-resolver: true
