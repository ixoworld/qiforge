packages:
  - 'apps/*'
  - 'packages/*'

# @veramo/credential-ld pulls in @veramo-community/lds-ecdsa-secp256k1-recovery2020,
# which Veramo only publishes as a git dependency (not on npm). pnpm v10+ blocks
# exotic (git/tarball) transitive deps by default; allow them so this resolves.
blockExoticSubdeps: false

peerDependencyRules:
  ignoreMissing:
    - 'react'
    - 'react-dom'
    - 'react-jazzicon'
    - '@mantine/core'
    - '@mantine/hooks'
    - '@blocknote/core'
    - '@blocknote/react'
    - '@blocknote/mantine'
    - '@ixo/surveys'

overrides:
  ws: '8.18.2'
  # Two copies of better-sqlite3 means two native addons, each with its own
  # statically-linked SQLite and its own environment cleanup hook. On exit both
  # tear down open handles outside an entered V8 context, which aborts the
  # process. Collapse to one build.
  better-sqlite3: '^12.9.0'
  # request (deprecated, via @ixo/matrix-bot-sdk fork) locks form-data@2.3.3,
  # which has a critical predictable-boundary advisory (GHSA-fjxv-7rqg-78g4
  # family). 2.5.4+ is the patched drop-in within the same major.
  'form-data@<2.5.4': '^2.5.4'
  # @ixo/did-provider-x 0.1.x pins did-resolver@5 while the veramo 6/7
  # ecosystem (and this repo) type against ^4.1.0 — the runtime API is
  # identical; collapse to one version so resolver types line up.
  did-resolver: '4.1.0'
  '@langchain/core': '1.1.48'
  '@langchain/langgraph': '1.3.2'
  '@langchain/langgraph-checkpoint': '1.0.2'
  '@langchain/langgraph-checkpoint-sqlite': '1.0.1'
  '@langchain/langgraph-checkpoint-validation': '1.0.9'
  '@langchain/langgraph-supervisor': '1.0.3'
  '@langchain/community': '1.1.29'
  '@langchain/openai': '1.4.7'
  '@langchain/textsplitters': '1.0.1'
  '@langchain/mcp-adapters': '1.1.3'
  langchain: '1.4.2'
  '@composio/core': '0.10.0'
  '@composio/langchain': '0.9.2'
  '@digitalbazaar/http-client': '4.2.0'
  '@ixo/matrix': '1.2.33'

# @veramo/utils@7 imports the subpath `@noble/hashes/sha256` but never declares
# @noble/hashes as a dependency (a phantom dep). pnpm resolves that undeclared
# import to the hoisted @noble/hashes@2, whose exports renamed `sha256` -> `sha2`,
# so the import fails ("subpath ./sha256 is not defined by exports"). Give veramo
# its own v1 copy (which still exports ./sha256); the v2 consumers are untouched.
packageExtensions:
  '@veramo/utils':
    dependencies:
      '@noble/hashes': '^1.8.0'

minimumReleaseAgeExclude:
  - '@ixo/*'

# Packages allowed to run install/build scripts. Replaces onlyBuiltDependencies,
# which pnpm v11 removed. These are native/postinstall-heavy deps we trust.
allowBuilds:
  '@ixo/matrix-sdk-crypto-nodejs': true
  '@matrix-org/matrix-sdk-crypto-nodejs': true
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  '@veramo/credential-ld': true
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  maplibre-gl: true
  msgpackr-extract: true
  protobufjs: true
  secp256k1: true
  sharp: true
  ssh2: true
  unrs-resolver: true
