name: CI

on:
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Prettier diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Prettier diff
        run: |
          pnpm exec prettier --write packages/oracle-runtime/src/decisions/adapters/cloudflare-jev.test.ts
          git diff -- packages/oracle-runtime/src/decisions/adapters/cloudflare-jev.test.ts
          exit 1
