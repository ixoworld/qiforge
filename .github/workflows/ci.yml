name: CI

on:
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # TypeScript treats aliased source under node_modules as external when
      # pnpm prepares the git editor dependency. Keep its build store outside it.
      - name: Configure pnpm source build store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Load read-only Portal editor key
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.PORTAL_EDITOR_READ_KEY }}
          log-public-key: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        # One ESLint process per package (scripts/lint.mjs); the largest
        # package's typed program still needs a few GB, so give Node room.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm lint

      - name: Format check
        run: pnpm format:check
